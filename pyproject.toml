[project]
name = "morningstar-prostar-app"
version = "0.1.0"
description = "Doover device app that monitors a Morningstar ProStar solar charge controller over RS485/Modbus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.9.1",
]

[project.scripts]
doover-app-run = "morningstar_prostar_app:main"
export-config = "morningstar_prostar_app.app_config:export"
export-ui = "morningstar_prostar_app.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio==1.67.0",
    "protobuf==5.28.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
